<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1115"/>
      <stop offset="100%" stop-color="#1c202a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#3a7bd5"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Card -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#bgGrad)" stroke="#2d3342" stroke-width="6"/>

  <!-- Speaker Cone Rings -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#252a36" stroke-width="8"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="url(#accentGrad)" stroke-width="12" opacity="0.4" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="90" fill="#181a22" stroke="#333a4c" stroke-width="8"/>

  <!-- Center Equalizer / Polyphony Waves -->
  <rect x="176" y="220" width="16" height="72" rx="8" fill="url(#glowGrad)"/>
  <rect x="208" y="180" width="16" height="152" rx="8" fill="url(#glowGrad)"/>
  <rect x="248" y="140" width="16" height="232" rx="8" fill="url(#glowGrad)"/>
  <rect x="288" y="190" width="16" height="132" rx="8" fill="url(#glowGrad)"/>
  <rect x="320" y="230" width="16" height="52" rx="8" fill="url(#glowGrad)"/>

  <!-- Orbiting Multi-Speaker Nodes -->
  <circle cx="110" cy="150" r="22" fill="url(#accentGrad)" filter="url(#glow)"/>
  <circle cx="402" cy="150" r="22" fill="url(#accentGrad)" filter="url(#glow)"/>
  <circle cx="256" cy="420" r="28" fill="url(#glowGrad)" filter="url(#glow)"/>
</svg>
