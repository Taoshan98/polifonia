<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Dark Studio Canvas Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14"/>
      <stop offset="50%" stop-color="#111622"/>
      <stop offset="100%" stop-color="#182030"/>
    </linearGradient>

    <!-- Electric Cyan to Emerald Neon Gradient for Orbit and Rays -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#38ef7d"/>
      <stop offset="100%" stop-color="#11998e"/>
    </linearGradient>

    <!-- Left Satellite Node Gradient -->
    <linearGradient id="leftNodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <!-- Right Satellite Node Gradient -->
    <linearGradient id="rightNodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d"/>
      <stop offset="100%" stop-color="#11998e"/>
    </linearGradient>

    <!-- Subwoofer Bass Node Gradient -->
    <linearGradient id="subNodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#38ef7d"/>
    </linearGradient>

    <!-- Core Driver Radial Gradient -->
    <radialGradient id="coreAcousticGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#38ef7d" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#111622" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Modern Squircle Base Frame -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="#1e2738" stroke-width="4"/>

  <!-- Subtle Concentric Soundstage Grid Rings -->
  <circle cx="256" cy="256" r="212" fill="none" stroke="#161e2c" stroke-width="2"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1c2536" stroke-width="2"/>

  <!-- Soft Central Acoustic Wave Diffusion -->
  <circle cx="256" cy="256" r="138" fill="url(#coreAcousticGrad)"/>

  <!-- Outer Soundstage Orbit Ring (3B-2 Precision Geometry) -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#neonGrad)" stroke-width="10"/>

  <!-- Phase Alignment Rays -->
  <line x1="87" y1="158.5" x2="190" y2="218" stroke="url(#leftNodeGrad)" stroke-width="10" stroke-linecap="round"/>
  <line x1="425" y1="158.5" x2="322" y2="218" stroke="url(#rightNodeGrad)" stroke-width="10" stroke-linecap="round"/>
  <line x1="256" y1="451" x2="256" y2="334" stroke="url(#subNodeGrad)" stroke-width="10" stroke-linecap="round"/>

  <!-- Central Studio Driver Core (Hollow Outer Ring + Concentric Pupils) -->
  <circle cx="256" cy="256" r="78" fill="#0d111a" stroke="url(#neonGrad)" stroke-width="9"/>
  <circle cx="256" cy="256" r="56" fill="none" stroke="#253248" stroke-width="5"/>
  <circle cx="256" cy="256" r="32" fill="url(#neonGrad)"/>

  <!-- 3 Physical Speaker Destination Nodes -->
  <!-- Left Speaker Satellite Node (Top-Left) -->
  <circle cx="87" cy="158.5" r="42" fill="#0d111a" stroke="url(#leftNodeGrad)" stroke-width="8"/>
  <circle cx="87" cy="158.5" r="22" fill="url(#leftNodeGrad)"/>

  <!-- Right Speaker Satellite Node (Top-Right) -->
  <circle cx="425" cy="158.5" r="42" fill="#0d111a" stroke="url(#rightNodeGrad)" stroke-width="8"/>
  <circle cx="425" cy="158.5" r="22" fill="url(#rightNodeGrad)"/>

  <!-- Subwoofer Bass Node (Bottom) -->
  <circle cx="256" cy="451" r="48" fill="#0d111a" stroke="url(#subNodeGrad)" stroke-width="9"/>
  <circle cx="256" cy="451" r="26" fill="url(#subNodeGrad)"/>
</svg>
