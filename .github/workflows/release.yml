name: Build & Publish Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 2.0.0 or v2.0.0; leave empty for auto-detection)'
        required: false
        type: string
        default: ''
      create_release:
        description: 'Create a GitHub Release with the built assets'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-packages:
    name: Build Multi-Format Packages
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Determine Release Version
        id: get_version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            RAW_VER="${{ inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            RAW_VER="${GITHUB_REF_NAME}"
          else
            RAW_VER=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          fi

          # Clean version without leading 'v' (e.g. 2.0.0)
          VERSION="${RAW_VER#v}"
          TAG_NAME="v${VERSION}"

          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "TAG_NAME=${TAG_NAME}" >> "$GITHUB_ENV"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "Building Polifonia release version: ${VERSION} (Tag: ${TAG_NAME})"

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libdbus-1-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libegl-dev \
            libgl-dev \
            desktop-file-utils \
            appstream \
            dpkg-dev \
            file \
            wget

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Native Release Binary & Portable Archive
        run: |
          python3 - <<'EOF'
          import os, re
          ver = os.environ["VERSION"]
          with open("Cargo.toml", "r", encoding="utf-8") as f:
              text = f.read()
          text = re.sub(r'(?m)^version\s*=\s*"[^"]+"', f'version = "{ver}"', text, count=1)
          with open("Cargo.toml", "w", encoding="utf-8") as f:
              f.write(text)
          EOF

          cargo test
          cargo build --release

          mkdir -p dist/packages
          STAGE_DIR="build/portable/Polifonia-${VERSION}-linux-x86_64"
          rm -rf "build/portable"
          mkdir -p "${STAGE_DIR}"
          install -Dm755 target/release/polifonia "${STAGE_DIR}/polifonia"
          install -Dm644 io.github.taoshan98.Polifonia.desktop "${STAGE_DIR}/io.github.taoshan98.Polifonia.desktop"
          install -Dm644 io.github.taoshan98.Polifonia.metainfo.xml "${STAGE_DIR}/io.github.taoshan98.Polifonia.metainfo.xml"
          install -Dm644 README.md "${STAGE_DIR}/README.md"
          install -Dm644 LICENSE "${STAGE_DIR}/LICENSE"
          cp -r assets "${STAGE_DIR}/assets"
          tar -C "build/portable" -czf "dist/packages/Polifonia-${VERSION}-linux-x86_64.tar.gz" "Polifonia-${VERSION}-linux-x86_64"

      # Debian package build temporarily commented out while preparing dedicated PPA/APT repo
      # - name: Build Debian Package (.deb)
      #   run: |
      #     chmod +x packaging/debian/build_deb.sh
      #     SKIP_CARGO_BUILD=1 ./packaging/debian/build_deb.sh "${{ env.VERSION }}"
      #     mv "polifonia_${{ env.VERSION }}_amd64.deb" dist/packages/

      - name: Build AppImage (.AppImage)
        run: |
          chmod +x packaging/appimage/build_appimage.sh packaging/appimage/AppRun
          SKIP_CARGO_BUILD=1 ./packaging/appimage/build_appimage.sh "${{ env.VERSION }}"

          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool

          ARCH=x86_64 ./appimagetool --no-appstream --appimage-extract-and-run build/AppDir "dist/packages/Polifonia-${{ env.VERSION }}-x86_64.AppImage"

      - name: Generate SHA256 Checksums
        run: |
          (cd dist/packages && sha256sum * > SHA256SUMS.txt)

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-packages-${{ env.VERSION }}
          path: dist/packages/*

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || inputs.create_release == true
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Polifonia ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/packages/*
