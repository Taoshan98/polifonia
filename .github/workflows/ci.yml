name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (Rust)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Install Build & Validation Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libdbus-1-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libegl-dev \
            libgl-dev \
            desktop-file-utils \
            appstream \
            dpkg-dev \
            file

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Validate Desktop & AppStream Metadata
        run: |
          desktop-file-validate io.github.taoshan98.Polifonia.desktop
          appstreamcli validate --no-net io.github.taoshan98.Polifonia.metainfo.xml

      - name: Run Unit & DSP Test Suite
        run: |
          RUSTFLAGS="-D warnings" cargo test --locked --verbose

      - name: Build Optimized Release Binary
        run: |
          RUSTFLAGS="-D warnings" cargo build --release --locked

      - name: Verify Packaging Layouts
        run: |
          chmod +x packaging/appimage/build_appimage.sh packaging/appimage/AppRun packaging/debian/build_deb.sh
          SKIP_CARGO_BUILD=1 ./packaging/appimage/build_appimage.sh 2.0.0
          test -x build/AppDir/usr/bin/polifonia
          test -x build/AppDir/AppRun
          test -f build/AppDir/usr/share/icons/hicolor/scalable/apps/polifonia-studio-color.svg
          SKIP_CARGO_BUILD=1 ./packaging/debian/build_deb.sh 2.0.0
          test -f polifonia_2.0.0_amd64.deb
