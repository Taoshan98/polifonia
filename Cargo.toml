[package]
name = "polifonia"
version = "2.0.0"
edition = "2021"
description = "High-precision multi-speaker acoustic synchronization and studio routing engine for PipeWire"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rustfft = "6.2"
ksni = "0.2"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
